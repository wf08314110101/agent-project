  select:focus, input:focus, textarea:focus { border-color: var(--brand); }

<script type="module">
import { ChatSession } from '../src/chat-session.js';
import { PROVIDERS, getProvider, isKeyRequired } from '../src/providers.js';

const LS_KEY = 'llm-sse-config';
const SYS = '你是一个简洁、直接的中文助手。';
const saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}');

const $ = (id) => document.getElementById(id);
const els = {
  provider: $('provider'),
  modelSelect: $('modelSelect'),
  modelCustom: $('modelCustom'),
  apiKey: $('apiKey'),
  baseUrl: $('baseUrl'),
  note: $('providerNote'),
  chat: $('chat'),
  input: $('input'),
  send: $('send'),
  stop: $('stop'),
  clear: $('clear'),
  stat: $('stat'),
};

PROVIDERS.forEach((p) => {
  const opt = document.createElement('option');
  opt.value = p.id;
  opt.textContent = p.name;
  els.provider.appendChild(opt);
});
els.provider.value = saved.providerId && getProvider(saved.providerId).id === saved.providerId
  ? saved.providerId
  : 'deepseek';

function renderModels(keepModel) {
  const p = getProvider(els.provider.value);
  els.note.textContent = p.note || '';

  if (!els.baseUrl.dataset.dirty || !els.baseUrl.value) els.baseUrl.value = p.baseURL || '';

  els.modelSelect.innerHTML = '';
  if (p.models.length) {
    p.models.forEach((m) => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      els.modelSelect.appendChild(opt);
    });
    const custom = document.createElement('option');
    custom.value = '__custom__';
    custom.textContent = '自定义模型名…';
    els.modelSelect.appendChild(custom);

    const want = keepModel || p.defaultModel || p.models[0];
    if (p.models.includes(want)) {
      els.modelSelect.value = want;
      els.modelSelect.hidden = false;
      els.modelCustom.hidden = true;
    } else {
      els.modelSelect.value = '__custom__';
      els.modelSelect.hidden = false;
      els.modelCustom.hidden = false;
      els.modelCustom.value = want || '';
    }
  } else {
    els.modelSelect.hidden = true;
    els.modelCustom.hidden = false;
    els.modelCustom.value = keepModel || '';
    els.modelCustom.placeholder = p.modelPlaceholder || '输入模型名';
  }
}

function currentConfig() {
  const p = getProvider(els.provider.value);
  const useCustom = els.modelSelect.hidden || els.modelSelect.value === '__custom__';
  return {
    providerId: p.id,
    providerName: p.name,
    baseURL: els.baseUrl.value.trim(),
    model: (useCustom ? els.modelCustom.value : els.modelSelect.value).trim(),
    apiKey: els.apiKey.value.trim(),
  };
}

function persist() {
  const cfg = currentConfig();
  localStorage.setItem(LS_KEY, JSON.stringify(cfg));
  return cfg;
}

els.provider.addEventListener('change', () => {
  els.baseUrl.dataset.dirty = '';
  renderModels('');
  persist();
});
els.modelSelect.addEventListener('change', () => {
  const custom = els.modelSelect.value === '__custom__';
  els.modelCustom.hidden = !custom;
  if (custom) els.modelCustom.focus();
  persist();
});
[els.modelCustom, els.apiKey].forEach((el) => el.addEventListener('change', persist));
els.baseUrl.addEventListener('input', () => {
  els.baseUrl.dataset.dirty = '1';
  persist();
});

let session = null;
let cfgKey = '';

function ensureSession(cfg) {
  const key = cfg.baseURL + '|' + cfg.model + '|' + cfg.apiKey;
  if (!session || key !== cfgKey) {
    const history = session ? session.getMessages() : [];
    session = new ChatSession({
      baseURL: cfg.baseURL,
      apiKey: cfg.apiKey,
      model: cfg.model,
      systemPrompt: SYS,
      maxTurns: 10,
    });
    if (history.length) session.setMessages(history);
    cfgKey = key;
  }
  return session;
}

function addBubble(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'me' ? '你' : role === 'err' ? '错误' : '助手';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(who);
  wrap.appendChild(bubble);
  els.chat.appendChild(wrap);
  els.chat.scrollTop = els.chat.scrollHeight;
  return { wrap, bubble };
}

let controller = null;
let raf = 0;

async function send() {
  const text = els.input.value.trim();
  if (!text) return;
  const cfg = persist();
  const provider = getProvider(cfg.providerId);

  if (!cfg.model) { alert('请填写模型名（第 2 步）'); return; }
  if (!cfg.baseURL) { alert('请填写 Base URL'); return; }
  if (!cfg.apiKey && isKeyRequired(provider) && !/localhost|127\.0\.0\.1/.test(cfg.baseURL)) {
    if (!confirm('没有填 API Key，可能产生 401。仍要继续吗？')) return;
  }

  els.input.value = '';
  addBubble('me', text);

  const { wrap, bubble } = addBubble('bot', '');
  bubble.classList.add('cursor');

  controller = new AbortController();
  els.send.disabled = true;
  els.stop.disabled = false;

  const startedAt = performance.now();
  let firstTokenAt = 0;
  let pending = '';

  const flush = () => {
    raf = 0;
    bubble.textContent = pending;
    els.chat.scrollTop = els.chat.scrollHeight;
  };

  try {
    const result = await ensureSession(cfg).send(text, {
      signal: controller.signal,
      onDelta: (delta, full) => {
        if (!firstTokenAt) firstTokenAt = performance.now();
        pending = full;
        if (!raf) raf = requestAnimationFrame(flush);
      },
    });
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    flush();

    const ms = performance.now() - startedAt;
    const ttft = firstTokenAt ? firstTokenAt - startedAt : null;
    const tokens = result.usage && result.usage.completion_tokens;
    const parts = [
      result.aborted ? '已中断' : (result.finishReason || 'done'),
      ttft ? '首 token ' + Math.round(ttft) + 'ms' : null,
      '耗时 ' + (ms / 1000).toFixed(2) + 's',
      tokens ? tokens + ' tokens · ' + (tokens / (ms / 1000)).toFixed(1) + ' tok/s' : null,
    ].filter(Boolean);
    els.stat.textContent = parts.join(' · ');
  } catch (err) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (err.name === 'AbortError') {
      bubble.textContent = pending || '[已中断]';
      els.stat.textContent = '已中断';
    } else {
      wrap.remove();
      addBubble('err', err.message + (err.status ? '（HTTP ' + err.status + ' ' + (err.code || '') + '）' : ''));
      els.stat.textContent = '请求失败';
    }
  } finally {
    bubble.classList.remove('cursor');
    controller = null;
    els.send.disabled = false;
    els.stop.disabled = true;
  }
}

els.send.addEventListener('click', send);
els.stop.addEventListener('click', () => controller && controller.abort());
els.clear.addEventListener('click', () => {
  if (session) session.clear();
  els.chat.innerHTML = '';
  els.stat.textContent = '已清空上下文';
});
els.input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

els.baseUrl.value = saved.baseURL || '';
els.apiKey.value = saved.apiKey || '';
renderModels(saved.model || '');
if (saved.baseURL) els.baseUrl.dataset.dirty = '1';
els.input.focus();
</script>
