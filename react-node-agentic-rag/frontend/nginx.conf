server {
  listen 80;

  # /api 反代 backend；SSE 必须关缓冲，拉长读超时
  location /api/ {
    proxy_pass http://backend:8788;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
