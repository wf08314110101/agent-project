server {
  listen 80;

  # 127.0.0.11 是 Docker 内置 DNS；valid=10s 让 nginx 周期性重新解析，
  # backend 多实例扩缩或重启换 IP 后无需重启 frontend 容器
  resolver 127.0.0.11 valid=10s ipv6=off;

  # /api 反代 backend；变量写法强制按请求解析服务名
  # SSE 必须关缓冲，拉长读超时
  location /api/ {
    set $backend_upstream backend;
    proxy_pass http://$backend_upstream:8788;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
