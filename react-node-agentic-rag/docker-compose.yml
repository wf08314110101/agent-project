services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentic-rag-qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped
    # M5 健康检查：backend 依赖其就绪后才启动（/readyz 表示可服务）
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: agentic-rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag123
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 12

  # M12 多实例共享态：限流计数 + 摄取事件广播（pub/sub）
  redis:
    image: redis:7-alpine
    container_name: agentic-rag-redis
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: agentic-rag-phoenix
    ports: ["6006:6006"]
    volumes: ["phoenix_data:/mnt/data"]
    restart: unless-stopped

  # 应用后端：env_file 提供密钥，environment 覆盖容器网内地址
  backend:
    build: ./backend
    container_name: agentic-rag-backend
    env_file: ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgres://rag:rag123@postgres:5432/rag
      REDIS_URL: redis://redis:6379
      PHOENIX_ENDPOINT: http://phoenix:6006/v1/traces
    volumes:
      - ./backend/data:/app/data # 嵌入模型缓存持久化
    # M5 健康检查：node 原生 fetch 探活 /api/health（含 Qdrant 连通性）
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 应用前端：nginx 托管 dist 并反代 /api
  frontend:
    build: ./frontend
    container_name: agentic-rag-frontend
    ports: ["8080:80"]
    depends_on:
      backend:
        condition: service_healthy # 前端反代的目标必须先就绪
    restart: unless-stopped

volumes:
  qdrant_data:
  phoenix_data:
  pg_data:
